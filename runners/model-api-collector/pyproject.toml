[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-api-collector"
version = "0.1.0"
description = "Collect raw model responses and latency through OneAPI."
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
model-api-collector = "model_api_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
