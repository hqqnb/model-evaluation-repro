<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>3D 数据可视化地球仪 · Three.js</title>
<style>
  :root{
    --bg:#03060d; --panel:rgba(10,18,32,.82); --line:rgba(120,180,255,.18);
    --txt:#dce8ff; --dim:#8ea6c8; --acc:#4fd1ff; --acc2:#ffb347;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #gl{position:fixed;inset:0;display:block;touch-action:none}

  /* 载入遮罩 */
  #loading{position:fixed;inset:0;display:grid;place-content:center;gap:14px;justify-items:center;
    background:radial-gradient(ellipse at center,#08131f,#02040a);z-index:50;transition:opacity .6s}
  #loading.off{opacity:0;pointer-events:none}
  .ring{width:46px;height:46px;border:3px solid rgba(79,209,255,.2);border-top-color:var(--acc);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadTxt{color:var(--dim);font-size:12px;letter-spacing:.5px}

  /* 控制面板 */
  #panel{position:fixed;top:14px;right:14px;width:286px;max-height:calc(100vh - 28px);
    background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);
    border-radius:12px;z-index:20;display:flex;flex-direction:column;
    box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
  #panel .hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.5px}
  #panel .hd small{color:var(--dim);font-weight:400;display:block;font-size:11px;letter-spacing:0}
  #panel .bd{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
  #panel.min .bd{display:none}
  .lbl{display:flex;justify-content:space-between;align-items:center;color:var(--dim);
    font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
  .lbl b{color:var(--acc);font-variant-numeric:tabular-nums}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:7px 0;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--dim);border-radius:8px;cursor:pointer;font-size:12px;transition:.18s}
  .seg button:hover{color:var(--txt);border-color:rgba(120,180,255,.4)}
  .seg button.on{background:linear-gradient(180deg,rgba(79,209,255,.28),rgba(79,209,255,.1));
    color:#fff;border-color:rgba(79,209,255,.7)}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#2a4a6a,#4fd1ff);outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;border:2px solid var(--acc);cursor:pointer;box-shadow:0 0 8px rgba(79,209,255,.8)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;
    border:2px solid var(--acc);cursor:pointer}
  .row{display:flex;gap:6px;align-items:center}
  .btn{padding:7px 10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);
    border-radius:8px;cursor:pointer;font-size:12px}
  .btn:hover{border-color:var(--acc);color:#fff}
  select{flex:1;background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:6px;font-size:12px}
  .chk{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
  .chk label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer}
  .chk input{accent-color:var(--acc)}
  #rank{display:flex;flex-direction:column;gap:3px;font-size:11px}
  #rank .r{display:flex;justify-content:space-between;gap:6px;padding:3px 6px;border-radius:5px;
    background:rgba(255,255,255,.035)}
  #rank .r i{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums}

  /* 图例 */
  #legend{position:fixed;left:14px;bottom:14px;z-index:20;background:var(--panel);
    backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:214px}
  #legend .t{font-size:11px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
  #bar{height:9px;border-radius:5px;margin-bottom:4px}
  #legend .sc{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  #legend .hint{margin-top:7px;font-size:11px;color:#6f88a8;line-height:1.5}

  /* HUD */
  #hud{position:fixed;left:14px;top:14px;z-index:20;font-size:11px;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;
    font-variant-numeric:tabular-nums;line-height:1.7}
  #hud b{color:var(--acc2)}

  /* 悬停提示 */
  #tip{position:fixed;z-index:40;pointer-events:none;opacity:0;transition:opacity .12s;
    background:rgba(6,12,22,.94);border:1px solid rgba(120,180,255,.35);border-radius:9px;
    padding:8px 10px;font-size:12px;max-width:250px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #tip .h{color:#fff;font-weight:600;margin-bottom:3px}
  #tip .l{display:flex;justify-content:space-between;gap:12px;color:var(--dim)}
  #tip .l span:last-child{color:var(--txt);font-variant-numeric:tabular-nums}

  /* 城市信息弹窗 */
  #card{position:fixed;left:14px;bottom:150px;width:250px;z-index:30;background:var(--panel);
    backdrop-filter:blur(12px);border:1px solid rgba(79,209,255,.35);border-radius:12px;
    padding:12px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6)}
  #card.on{display:block;animation:pop .22s ease-out}
  @keyframes pop{from{transform:translateY(8px) scale(.97);opacity:0}}
  #card .x{position:absolute;top:7px;right:9px;cursor:pointer;color:var(--dim);font-size:15px}
  #card .x:hover{color:#fff}
  #card h3{margin:0 0 2px;font-size:15px}
  #card .sub{color:var(--dim);font-size:11px;margin-bottom:8px}
  #card .kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed rgba(120,180,255,.13);font-size:12px}
  #card .kv span:last-child{color:var(--acc);font-variant-numeric:tabular-nums}
  #card .rt{margin-top:8px;font-size:11px;color:var(--dim);line-height:1.7}
  #card .rt b{color:var(--txt);font-weight:500}

  @media (max-width:640px){
    #panel{width:calc(100vw - 28px);max-height:52vh}
    #legend{width:calc(100vw - 28px)}
    #card{bottom:auto;top:64px;width:calc(100vw - 28px)}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading"><div class="ring"></div><div id="loadTxt">正在加载地球纹理…</div></div>

<div id="hud">
  <div>UTC <b id="hClock">--:--</b> · 第 <b id="hDoy">-</b> 天</div>
  <div>年份 <b id="hYear">-</b> · <span id="hFps">-- FPS</span></div>
</div>

<div id="panel">
  <div class="hd">
    <span>数据可视化控制台<small>Three.js Data Globe</small></span>
    <span class="btn" id="collapse" style="padding:2px 8px">—</span>
  </div>
  <div class="bd">
    <div class="lbl"><span>数据指标</span></div>
    <div class="seg" id="metricSeg">
      <button data-m="gdp" class="on">GDP</button>
      <button data-m="pop">人口</button>
      <button data-m="flights">航班量</button>
    </div>

    <div class="lbl"><span>时间轴</span><b id="yearLabel">2000</b></div>
    <input type="range" id="year" min="2000" max="2025" step="0.01" value="2000">
    <div class="row">
      <button class="btn" id="play" style="flex:1">▶ 播放</button>
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </div>

    <div class="lbl"><span>显示图层</span></div>
    <div class="chk">
      <label><input type="checkbox" id="tHeat" checked>热力着色</label>
      <label><input type="checkbox" id="tArc" checked>航线弧</label>
      <label><input type="checkbox" id="tCity" checked>城市点</label>
      <label><input type="checkbox" id="tLabel" checked>城市名</label>
      <label><input type="checkbox" id="tAtm" checked>大气光晕</label>
      <label><input type="checkbox" id="tStar" checked>星空</label>
    </div>

    <div class="lbl"><span>自转速度</span><b id="spinLabel">1.0×</b></div>
    <input type="range" id="spin" min="0" max="8" step="0.1" value="1">

    <div class="lbl"><span>时刻 (UTC 小时)</span><b id="hourLabel">12.0</b></div>
    <input type="range" id="hour" min="0" max="24" step="0.05" value="12">

    <div class="lbl"><span>季节 (年内日序)</span><b id="doyLabel">172</b></div>
    <input type="range" id="doy" min="1" max="365" step="1" value="172">

    <div class="lbl"><span>热力层不透明度</span><b id="opaLabel">0.62</b></div>
    <input type="range" id="opa" min="0" max="1" step="0.01" value="0.62">

    <div class="lbl"><span>夜间灯光强度</span><b id="nlLabel">1.3</b></div>
    <input type="range" id="nl" min="0" max="3" step="0.05" value="1.3">

    <div class="lbl"><span id="rankTitle">地区排行</span></div>
    <div id="rank"></div>

    <div class="row">
      <button class="btn" id="reset" style="flex:1">重置视角</button>
      <button class="btn" id="shot" style="flex:1">截图 PNG</button>
    </div>
  </div>
</div>

<div id="legend">
  <div class="t" id="legendTitle">GDP 热力标尺</div>
  <div id="bar"></div>
  <div class="sc"><span id="lgMin">-</span><span id="lgMax">-</span></div>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 点击城市查看详情 · 悬停航线查看航班</div>
</div>

<div id="tip"></div>

<div id="card">
  <div class="x" id="cardX">✕</div>
  <h3 id="cName">-</h3>
  <div class="sub" id="cSub">-</div>
  <div id="cKV"></div>
  <div class="rt" id="cRt"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

const R = 1;                     // 地球半径
const Y0 = 2000, Y1 = 2025;      // 时间轴范围
const METRICS = {
  gdp:     { name:'GDP',    unitCity:'亿美元', unitReg:'万亿美元', cityF:v=>v.toFixed(0), regF:v=>v.toFixed(2) },
  pop:     { name:'人口',   unitCity:'百万人', unitReg:'百万人',   cityF:v=>v.toFixed(1), regF:v=>v.toFixed(0) },
  flights: { name:'航班量', unitCity:'百万客/年', unitReg:'百万客/年', cityF:v=>v.toFixed(1), regF:v=>v.toFixed(0) }
};
let metric = 'gdp';

/** 经纬度 -> 三维坐标（与等距圆柱投影贴图对齐） */
function ll2v(lat, lon, r = R, out = new THREE.Vector3()){
  const phi = (90 - lat) * Math.PI / 180;
  const th  = (lon + 180) * Math.PI / 180;
  return out.set(-r*Math.sin(phi)*Math.cos(th), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(th));
}
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return ((h>>>0)%10000)/10000; }
/** 大圆距离 km */
function gcKm(a,b){
  const t=Math.PI/180, la1=a.lat*t, la2=b.lat*t, dl=(b.lon-a.lon)*t;
  const c=Math.sin(la1)*Math.sin(la2)+Math.cos(la1)*Math.cos(la2)*Math.cos(dl);
  return 6371*Math.acos(clamp(c,-1,1));
}
/** 颜色标尺 (低->高)：深蓝 → 青 → 绿 → 黄 → 橙红 */
const RAMP = [[12,32,86],[16,110,178],[26,196,190],[126,214,102],[248,214,86],[246,138,48],[224,58,52]];
function ramp(t){
  t = clamp(t,0,1)*(RAMP.length-1);
  const i = Math.min(RAMP.length-2, Math.floor(t)), f = t-i;
  const a = RAMP[i], b = RAMP[i+1];
  return [Math.round(lerp(a[0],b[0],f)), Math.round(lerp(a[1],b[1],f)), Math.round(lerp(a[2],b[2],f))];
}
const rampCss = t => { const c = ramp(t); return `rgb(${c[0]},${c[1]},${c[2]})`; };

/** 随年份增长的指标值（含 2020-2021 航空业下滑） */
function valueAt(base, g, year, key, m){
  const t = year - Y0;
  let v = base * Math.pow(1+g, t);
  v *= 1 + 0.025*Math.sin(hash(key+m)*12 + t*1.6);
  if (m === 'flights'){
    if (year >= 2019.9 && year < 2021)      v *= lerp(1, 0.38, clamp((year-19.9-1980)/0 + (year-2019.9)/0.6,0,1));
    else if (year >= 2021 && year < 2022.6) v *= lerp(0.45, 0.95, (year-2021)/1.6);
  }
  return v;
}

function projX(lon,W){ return (lon+180)/360*W; }
function projY(lat,H){ return (90-lat)/180*H; }
function fillPoly(ctx, poly, W, H){
  ctx.beginPath();
  poly.forEach((p,i)=>{ const x=projX(p[0],W), y=projY(p[1],H); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.closePath(); ctx.fill();
}

   4. 地球（自定义着色器：昼夜分界 + 城市灯光 + 海面高光）
   ============================================================ */
const earthUni = {
  uDay:{value:null}, uNight:{value:null},
  uSun:{value:new THREE.Vector3(1,0,0)},   // 地球本地坐标系
  uCam:{value:new THREE.Vector3()},        // 地球本地坐标系
  uNight_gain:{value:1.3}, uTime:{value:0}
};
const earthMat = new THREE.ShaderMaterial({
  uniforms: earthUni,
  vertexShader:/*glsl*/`
    varying vec2 vUv; varying vec3 vPos; varying vec3 vNrm;
    void main(){
      vUv = uv; vPos = position; vNrm = normalize(normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader:/*glsl*/`
    uniform sampler2D uDay; uniform sampler2D uNight;
    uniform vec3 uSun; uniform vec3 uCam;
    uniform float uNight_gain; uniform float uTime;
    varying vec2 vUv; varying vec3 vPos; varying vec3 vNrm;
    void main(){
      vec3 N = normalize(vNrm);
      vec3 V = normalize(uCam - vPos);
      vec3 S = normalize(uSun);
      float s = dot(N, S);
      float day = smoothstep(-0.14, 0.22, s);          // 昼夜分界线（带晨昏蒙影）

      vec3 dayC   = texture2D(uDay, vUv).rgb;
      vec3 nightC = texture2D(uNight, vUv).rgb;
      float water = clamp((dayC.b - dayC.r*0.85) * 4.0, 0.0, 1.0);

      vec3 col = dayC * (0.14 + 1.12 * clamp(s, 0.0, 1.0));
      // 海面镜面高光
      vec3 H = normalize(S + V);
      col += vec3(0.9,0.95,1.0) * pow(max(dot(N,H),0.0), 42.0) * water * smoothstep(0.0,0.18,s) * 0.6;
      // 夜面城市灯光（含轻微闪烁）
      float tw = 0.9 + 0.1*sin(uTime*2.2 + vUv.x*420.0 + vUv.y*260.0);
      vec3 lights = nightC * vec3(1.15,0.92,0.60) * uNight_gain * tw;
      col = mix(col*0.05 + lights, col, day);
      // 晨昏线附近的暖色散射
      float term = exp(-pow(s*7.0, 2.0));
      col += vec3(0.55,0.30,0.12) * term * 0.22;
      // 边缘大气
      float rim = pow(1.0 - max(dot(N,V),0.0), 3.0);
      col += vec3(0.25,0.45,0.9) * rim * (0.22 + 0.78*day);

      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`
});

function arcCurve(a, b, seg=110){
  const va = ll2v(a.lat,a.lon,1), vb = ll2v(b.lat,b.lon,1);
  const ang = va.angleTo(vb), sa = Math.sin(ang);
  const h = 0.10 + 0.30*(ang/Math.PI);
  const pts = [];
  for(let i=0;i<=seg;i++){
    const t=i/seg;
    const p = new THREE.Vector3();
    if (sa < 1e-6) p.copy(va).lerp(vb,t).normalize();
    else p.copy(va).multiplyScalar(Math.sin((1-t)*ang)/sa)
          .addScaledVector(vb, Math.sin(t*ang)/sa).normalize();
    p.multiplyScalar(R*(1 + h*Math.sin(Math.PI*t)));
    pts.push(p);
  }
  return new THREE.CatmullRomCurve3(pts);
}
const arcVS = /*glsl*/`
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const arcFS = /*glsl*/`
  uniform vec3 uColor; uniform float uTime, uSpeed, uPhase, uOpacity, uBase;
  varying vec2 vUv;
  void main(){
    float head = fract(uTime * uSpeed + uPhase);
    float d = vUv.x - head; d -= floor(d);            // 与光头的距离(尾随)
    float pulse = exp(-d * 15.0) + 0.55*exp(-d*60.0);
    float ends = smoothstep(0.0,0.05,vUv.x) * smoothstep(1.0,0.95,vUv.x);
    float a = (uBase + pulse) * uOpacity * ends;
    vec3 col = mix(uColor, vec3(1.0,0.98,0.92), clamp(pulse,0.0,1.0)*0.75);
    gl_FragColor = vec4(col, clamp(a,0.0,1.0));
    #include <colorspace_fragment>
  }`;
const arcGroup = new THREE.Group(); earthGroup.add(arcGroup);
ROUTES.forEach(r=>{
  const curve = arcCurve(r.a, r.b);
  const geo = new THREE.TubeGeometry(curve, 128, 0.0035, 5, false);
  const mat = new THREE.ShaderMaterial({
    uniforms:{
      uColor:{value:new THREE.Color().setHSL(0.52 - 0.18*hash(r.flight), 0.9, 0.62)},
      uTime:{value:0}, uSpeed:{value:0.12 + 0.16*hash(r.flight+'s')},
      uPhase:{value:hash(r.flight+'p')}, uOpacity:{value:0.9}, uBase:{value:0.16}
    },
    vertexShader:arcVS, fragmentShader:arcFS,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
  });
  const m = new THREE.Mesh(geo, mat);
  m.userData = { route:r }; r.mesh = m; arcGroup.add(m);
});

/* ============================================================
   8. 时间 / 太阳位置（昼夜分界物理一致）
   ============================================================ */
const state = { year:Y0, hour:12, doy:172, playing:false, speed:1, spin:1 };
function sunLocal(){
  const dec = -23.44 * Math.cos(2*Math.PI*(state.doy+10)/365.24);   // 太阳赤纬
  const lon = -15 * (state.hour - 12);                             // 直射点经度
  return { dec, lon, v: ll2v(dec, lon, 1) };
}
function applyTime(){
  const s = sunLocal();
  earthUni.uSun.value.copy(s.v);
  // 地球自转角 = -直射点经度 → 太阳在世界坐标中固定于 +X
  earthGroup.rotation.y = THREE.MathUtils.degToRad(-s.lon);
  atmUni.uSunW.value.copy(s.v).applyAxisAngle(new THREE.Vector3(0,1,0), earthGroup.rotation.y);
  document.getElementById('hClock').textContent =
    String(Math.floor(state.hour)%24).padStart(2,'0')+':'+String(Math.floor(state.hour%1*60)).padStart(2,'0');
  document.getElementById('hDoy').textContent = state.doy;
}

/* ============================================================
   9. 数据驱动更新（城市点尺寸、航线粗细、热力层、排行）
   ============================================================ */
let lastHeatYear = -1;
function updateData(force=false){
  const y = state.year;
  document.getElementById('yearLabel').textContent = Math.round(y);
  document.getElementById('hYear').textContent = Math.round(y);

  // 城市点：按指标归一化尺寸
  const cv = CITIES.map(c=>cityValue(c,y));
  const lmn = Math.log(Math.min(...cv)), lmx = Math.log(Math.max(...cv));
  CITIES.forEach((c,i)=>{
    const t = (Math.log(cv[i]) - lmn) / Math.max(1e-6, lmx-lmn);
    c.norm = t; c.cur = cv[i];
    const s = 0.028 + 0.085*Math.pow(t,0.85);
    c.sprite.scale.set(s,s,1);
    const col = ramp(t);
    c.sprite.material.color.setRGB(col[0]/255*1.1, col[1]/255*1.1, col[2]/255*1.1);
    c.core.scale.setScalar(0.7 + t*1.6);
  });

  // 航线：客流决定亮度
  const rv = ROUTES.map(r=>routePax(r,y));
  const rmx = Math.max(...rv);
  ROUTES.forEach((r,i)=>{
    r.cur = rv[i];
    const t = rv[i]/rmx;
    r.mesh.material.uniforms.uOpacity.value = 0.35 + 0.65*Math.pow(t,0.6);
    r.mesh.material.uniforms.uBase.value = 0.10 + 0.14*t;
  });

  // 热力层（播放时节流重绘）
  if (force || Math.abs(y-lastHeatYear) > 0.12){ drawHeat(y); lastHeatYear = y; }
  updateRank();
  if (activeCity) fillCard(activeCity);
}
function fmtReg(v){ return METRICS[metric].regF(v) + ' ' + METRICS[metric].unitReg; }
function updateRank(){
  const y = state.year;
  const arr = REGIONS.map(r=>({ name:r.name, v:regValue(r,y) })).sort((a,b)=>b.v-a.v).slice(0,6);
  const mx = arr[0].v;
  document.getElementById('rankTitle').textContent = `地区排行 · ${METRICS[metric].name}`;
  document.getElementById('rank').innerHTML = arr.map((d,i)=>
    `<div class="r" style="background:linear-gradient(90deg,${rampCss(d.v/mx)}33 ${d.v/mx*100}%,rgba(255,255,255,.03) 0)">
       <span>${i+1}. ${d.name}</span><i>${fmtReg(d.v)}</i></div>`).join('');
}
function updateLegend(){
  const stops = [0,.16,.33,.5,.66,.83,1].map(t=>`${rampCss(t)} ${t*100}%`).join(',');
  document.getElementById('bar').style.background = `linear-gradient(90deg,${stops})`;
  document.getElementById('legendTitle').textContent = `${METRICS[metric].name} 热力标尺（${METRICS[metric].unitReg}）`;
  document.getElementById('lgMin').textContent = METRICS[metric].regF(heatRange[0]);
  document.getElementById('lgMax').textContent = METRICS[metric].regF(heatRange[1]);
}

/* ============================================================
   10. 交互：拾取、弹窗、提示
   ============================================================ */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tip = document.getElementById('tip');
const card = document.getElementById('card');
let activeCity = null, hoverArc = null, pointerDown=null, moved=false;

function setNdc(e){ ndc.x = (e.clientX/innerWidth)*2-1; ndc.y = -(e.clientY/innerHeight)*2+1; }
function pick(){
  ray.setFromCamera(ndc, camera);
  if (cityGroup.visible){
    const hs = ray.intersectObjects(cityGroup.children, false).filter(h=>h.object.userData.city);
    if (hs.length) return { type:'city', city:hs[0].object.userData.city };
  }
  if (arcGroup.visible){
    const hs = ray.intersectObjects(arcGroup.children, false);
    if (hs.length) return { type:'arc', route:hs[0].object.userData.route };
  }
  return null;
}
function showTip(html, x, y){
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(innerWidth - r.width - 10, x + 14) + 'px';
  tip.style.top  = Math.min(innerHeight - r.height - 10, y + 14) + 'px';
}
const hideTip = ()=>{ tip.style.opacity = 0; };

renderer.domElement.addEventListener('pointerdown', e=>{ pointerDown={x:e.clientX,y:e.clientY}; moved=false; });
renderer.domElement.addEventListener('pointermove', e=>{
  if (pointerDown && (Math.abs(e.clientX-pointerDown.x)>4 || Math.abs(e.clientY-pointerDown.y)>4)) moved=true;
  setNdc(e);
  const h = pick();
  // 复位上一条高亮航线
  if (hoverArc && (!h || h.type!=='arc' || h.route!==hoverArc)){ hoverArc.mesh.material.uniforms.uBase.value *= 0.5; hoverArc = null; }
  if (!h){ hideTip(); renderer.domElement.style.cursor='grab'; return; }
  renderer.domElement.style.cursor='pointer';
  if (h.type === 'city'){
    const c = h.city, M = METRICS[metric];
    showTip(`<div class="h">${c.name} <span style="color:#8ea6c8">${c.code}</span></div>
      <div class="l"><span>${M.name}</span><span>${M.cityF(c.cur)} ${M.unitCity}</span></div>
      <div class="l"><span>直飞航线</span><span>${c.routes.length} 条</span></div>
      <div class="l" style="color:#4fd1ff"><span>点击查看详情</span><span></span></div>`, e.clientX, e.clientY);
  } else {
    const r = h.route;
    if (hoverArc !== r){ hoverArc = r; r.mesh.material.uniforms.uBase.value *= 2; }
    const hrs = r.km/850 + 0.6;
    showTip(`<div class="h">${r.airline} ${r.flight}</div>
      <div class="l"><span>航段</span><span>${r.a.name} → ${r.b.name}</span></div>
      <div class="l"><span>机型</span><span>${r.ac}</span></div>
      <div class="l"><span>大圆距离</span><span>${r.km.toLocaleString()} km</span></div>
      <div class="l"><span>预计飞行</span><span>${Math.floor(hrs)}h ${Math.round(hrs%1*60)}m</span></div>
      <div class="l"><span>年客运量</span><span>${r.cur.toFixed(2)} 百万人</span></div>
      <div class="l"><span>周班次(估)</span><span>${Math.max(1,Math.round(r.cur*1e6/52/260))} 班</span></div>`,
      e.clientX, e.clientY);
  }
});
renderer.domElement.addEventListener('pointerup', e=>{
  pointerDown = null;
  if (moved) return;                       // 拖拽旋转不触发点击
  setNdc(e);
  const h = pick();
  if (h && h.type==='city') openCard(h.city);
  else if (!h) closeCard();
});
renderer.domElement.addEventListener('pointerleave', hideTip);

function openCard(c){ activeCity = c; fillCard(c); card.classList.add('on'); }
function closeCard(){ activeCity = null; card.classList.remove('on'); }
document.getElementById('cardX').onclick = closeCard;
function fillCard(c){
  const y = state.year;
  document.getElementById('cName').textContent = `${c.name} (${c.code})`;
  document.getElementById('cSub').textContent =
    `${c.country} · ${c.lat.toFixed(2)}°, ${c.lon.toFixed(2)}° · ${Math.round(y)} 年`;
  const rows = [
    ['GDP', METRICS.gdp.cityF(cityValue(c,y,'gdp')) + ' 亿美元'],
    ['人口', METRICS.pop.cityF(cityValue(c,y,'pop')) + ' 百万人'],
    ['航空客运', METRICS.flights.cityF(cityValue(c,y,'flights')) + ' 百万客/年'],
    ['人均 GDP', (cityValue(c,y,'gdp')*1e8/(cityValue(c,y,'pop')*1e6)/1e3).toFixed(1) + ' 千美元']
  ];
  document.getElementById('cKV').innerHTML =
    rows.map(r=>`<div class="kv"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
  const top = c.routes.map(r=>({ r, v:routePax(r,y) })).sort((a,b)=>b.v-a.v).slice(0,4);
  document.getElementById('cRt').innerHTML = `直飞航线 ${c.routes.length} 条，主要航段：<br>` +
    (top.length ? top.map(t=>{
      const o = t.r.a===c ? t.r.b : t.r.a;
      return `· <b>${o.name}</b> ${t.r.flight} · ${t.v.toFixed(2)} 百万客`;
    }).join('<br>') : '（暂无数据）');
}

/* ============================================================
   11. UI 绑定
   ============================================================ */
const $ = id=>document.getElementById(id);
$('metricSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  [...$('metricSeg').children].forEach(x=>x.classList.toggle('on', x===b));
  metric = b.dataset.m; updateData(true);
});
$('year').addEventListener('input', e=>{ state.year = +e.target.value; updateData(); });
$('play').onclick = ()=>{ state.playing = !state.playing; $('play').textContent = state.playing ? '⏸ 暂停' : '▶ 播放'; };
$('speed').onchange = e=>state.speed = +e.target.value;
$('spin').addEventListener('input', e=>{ state.spin = +e.target.value; $('spinLabel').textContent = state.spin.toFixed(1)+'×'; });
$('hour').addEventListener('input', e=>{ state.hour = +e.target.value; $('hourLabel').textContent = state.hour.toFixed(1); applyTime(); });
$('doy').addEventListener('input',  e=>{ state.doy = +e.target.value;  $('doyLabel').textContent = state.doy; applyTime(); });
$('opa').addEventListener('input',  e=>{ heatMesh.material.opacity = +e.target.value; $('opaLabel').textContent = (+e.target.value).toFixed(2); });
$('nl').addEventListener('input',   e=>{ earthUni.uNight_gain.value = +e.target.value; $('nlLabel').textContent = (+e.target.value).toFixed(2); });
$('tHeat').onchange  = e=>heatMesh.visible   = e.target.checked;
$('tArc').onchange   = e=>arcGroup.visible   = e.target.checked;
$('tCity').onchange  = e=>cityGroup.visible  = e.target.checked;
$('tLabel').onchange = e=>labelGroup.visible = e.target.checked;
$('tAtm').onchange   = e=>atmosphere.visible = e.target.checked;
$('tStar').onchange  = e=>stars.visible      = e.target.checked;
$('collapse').onclick = ()=>{
  $('panel').classList.toggle('min');
  $('collapse').textContent = $('panel').classList.contains('min') ? '+' : '—';
};
$('reset').onclick = ()=>{ camera.position.set(2.1,1.15,2.6); controls.target.set(0,0,0); controls.update(); };
$('shot').onclick = ()=>{
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = `globe-${metric}-${Math.round(state.year)}.png`;
  a.href = renderer.domElement.toDataURL('image/png'); a.click();
};
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', e=>{
  if (e.code === 'Space'){ e.preventDefault(); $('play').click(); }
  if (e.key === 'r' || e.key === 'R') $('reset').click();
});

/* ============================================================
   12. 主循环
   ============================================================ */
const clock = new THREE.Clock();
const camLocal = new THREE.Vector3();
let fpsT = 0, fpsN = 0;

function tick(){
  const dt = Math.min(0.05, clock.getDelta());
  const t  = clock.elapsedTime;

  // 时间推进：自转 = 模拟时钟推进（昼夜线保持在空间中固定）
  if (state.spin > 0){
    state.hour += dt * state.spin * 1.2;
    while (state.hour >= 24){ state.hour -= 24; state.doy = state.doy % 365 + 1; $('doy').value = state.doy; $('doyLabel').textContent = state.doy; }
    $('hour').value = state.hour; $('hourLabel').textContent = state.hour.toFixed(1);
    applyTime();
  }
  // 时间轴播放
  if (state.playing){
    state.year += dt * 1.15 * state.speed;
    if (state.year > Y1) state.year = Y0;
    $('year').value = state.year;
    updateData();
  }

  // 着色器 uniform 更新
  earthUni.uTime.value = t;
  earth.worldToLocal(camLocal.copy(camera.position));
  earthUni.uCam.value.copy(camLocal);
  arcGroup.children.forEach(m=>{ m.material.uniforms.uTime.value = t; });

  // 标签：背面隐藏 + 距离自适应大小
  if (labelGroup.visible){
    const camDir = camera.position.clone().normalize();
    const d = camera.position.length();
    const scale = clamp(0.045 * d/2.5, 0.028, 0.075);
    labelGroup.children.forEach(lb=>{
      const c = lb.userData.city;
      const n = lb.position.clone().applyMatrix4(earthGroup.matrixWorld).normalize();
      const facing = n.dot(camDir) > 0.28;
      const big = c.norm > (d > 4 ? 0.65 : d > 2.4 ? 0.42 : 0);
      lb.visible = facing && big;
      lb.scale.set(scale*lb.userData.aspect, scale, 1);
    });
  }
  // 选中城市脉冲
  if (activeCity){
    const s = activeCity.sprite.scale.x;
    activeCity.core.scale.setScalar((1.2 + 0.6*Math.sin(t*5)) * (0.7 + activeCity.norm*1.6));
  }

  controls.update();
  renderer.render(scene, camera);

  fpsN++; if (t - fpsT > 0.5){ $('hFps').textContent = Math.round(fpsN/(t-fpsT)) + ' FPS'; fpsT = t; fpsN = 0; }
  requestAnimationFrame(tick);
}

/* ============================================================
   13. 启动
   ============================================================ */
(async function init(){
  const [day, night] = await Promise.all([
    loadTex(CDN + 'earth-blue-marble.jpg'),
    loadTex(CDN + 'earth-night.jpg')
  ]);
  const offline = !day || !night;
  earthUni.uDay.value   = day   || fallbackDay();
  earthUni.uNight.value = night || fallbackNight();
  if (offline) $('loadTxt').textContent = '在线纹理不可用，已启用离线程序化贴图';

  applyTime();
  updateData(true);
  const ld = $('loading');
  setTimeout(()=>{ ld.classList.add('off'); setTimeout(()=>ld.remove(), 700); }, offline ? 900 : 250);
  tick();
})();
</script>
