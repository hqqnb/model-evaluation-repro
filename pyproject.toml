[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-evaluation-repro"
version = "0.1.0"
description = "Reproducible model and agent evaluation workspace."
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
